<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinamilk 100% Sữa Tươi - Tết Khoẻ Re</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #FEFDF0;
            display: flex;
            justify-content: center;
        }

        /* Khung chuẩn tỷ lệ thiết kế, vừa vặn tầm mắt trên mọi màn hình */
        .landing-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            background: #FEFDF0;
            box-shadow: 0 0 50px rgba(0, 51, 160, 0.08);
            overflow: hidden;
        }

        /* Ảnh thiết kế gốc nằm trong thư mục images/ */
        .design-canvas {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        /* ================= HIỆU ỨNG CUỘN TỚI ĐÂU ĐỘNG TỚI ĐÓ (SCROLL REVEAL) ================= */
        .scroll-zone {
            position: absolute;
            left: 3%;
            width: 94%;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(35px) scale(0.98);
            transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.35s ease;
            z-index: 5;
        }

        .scroll-zone.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Khung bao 3 thẻ Voucher tương tác nổi lên khi rê chuột hoặc cuộn tới */
        .voucher-card-zone {
            position: absolute;
            top: 72.35%;
            height: 5.55%;
            width: 28.5%;
            border-radius: 12px;
            z-index: 12;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease,
                        background-color 0.3s ease;
        }

        .voucher-card-zone:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 14px 28px rgba(0, 51, 160, 0.16);
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* ================= HIỆU ỨNG CHUYỂN ĐỘNG NÚT BẤM ================= */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 210, 0, 0.75);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 210, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 210, 0, 0);
            }
        }

        @keyframes sheenSweep {
            0% { left: -75%; }
            100% { left: 125%; }
        }

        .hotspot-btn {
            position: absolute;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 14;
            overflow: hidden;
        }

        .hotspot-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 200, 0, 0.85);
            background: rgba(255, 255, 255, 0.14);
        }

        .hotspot-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            pointer-events: none;
        }

        .hotspot-btn:hover::after {
            animation: sheenSweep 0.65s ease-out;
        }

        .hotspot-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* 1. Nút "Đăng kí ưu đãi" ở Hero Banner -> chuyển sang Render */
        .btn-hero {
            top: 8.55%;
            left: 39.2%;
            width: 35.2%;
            height: 1.4%;
            animation: pulseGlow 2.2s infinite;
        }

        /* 2. Nút "Đăng kí ngay" dưới mục Mời bạn sắm sữa */
        .btn-products {
            top: 38.35%;
            left: 59.5%;
            width: 13.5%;
            height: 0.9%;
        }

        /* 3. Nút "Đăng kí ngay" ở banner Tích điểm đổi quà */
        .btn-loyalty {
            top: 56.05%;
            left: 42.5%;
            width: 15%;
            height: 0.95%;
        }

        /* 4. Nút "Đăng kí ngay" dưới mục Tận hưởng dễ dàng */
        .btn-steps {
            top: 70.05%;
            left: 59.5%;
            width: 13.5%;
            height: 0.9%;
        }

        /* Nút bấm đè lên 3 nút Đăng nhập ở khu vực Voucher */
        .btn-voucher-login {
            position: absolute;
            background: transparent;
            border: 1.5px solid transparent;
            cursor: pointer;
            border-radius: 6px;
            z-index: 18;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-voucher-login:hover {
            transform: translateY(-2px) scale(1.08);
            background-color: rgba(0, 51, 160, 0.12);
            border-color: #0033A0;
            box-shadow: 0 4px 12px rgba(0, 51, 160, 0.25);
        }

        .btn-voucher-login:active {
            transform: scale(0.96);
        }

        /* ================= FIX CHUẨN KHÍT THẺ VOUCHER TRÀ ATISÔ ĐẦU TIÊN ================= */
        .voucher-fix-overlay {
            position: absolute;
            top: 72.42%;
            left: 5.15%;
            width: 28.35%;
            height: 2.98%;
            background: linear-gradient(135deg, #F3FAD8 0%, #E4F5B8 100%);
            border-radius: 8px 8px 0 0;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            box-shadow: inset 0 0 0 1.5px #CBE38A;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            cursor: pointer;
        }

        .voucher-fix-overlay:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: inset 0 0 0 1.5px #9AC738, 0 10px 20px rgba(92, 145, 20, 0.2);
        }

        .voucher-fix-overlay .v-sub {
            color: #6B9E1E;
            font-size: clamp(9px, 0.95vw, 13px);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.25;
        }

        .voucher-fix-overlay .v-store {
            background: #6D3B96;
            color: #fff;
            font-size: clamp(9px, 0.9vw, 12px);
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
            margin: 4px 0;
            letter-spacing: 0.4px;
        }

        .voucher-fix-overlay .v-amount {
            color: #5C9114;
            font-size: clamp(16px, 2.1vw, 28px);
            font-weight: 900;
            line-height: 1;
        }

        /* ================= FORM ĐĂNG KÝ CHE PHỦ HOÀN TOÀN VÙNG CŨ TRÊN ẢNH ================= */
        .overlay-form-container {
            position: absolute;
            top: 83.35%;
            left: 19.8%;
            width: 65.5%;
            background: #FEFDF0;
            padding: 10px 14px 150px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .overlay-form-container.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 14px;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .real-input {
            width: 100%;
            height: 44px;
            background: #EEF2F7;
            border: none;
            border-bottom: 1.5px solid #0033A0;
            border-radius: 4px 4px 0 0;
            padding: 0 42px 0 14px;
            font-size: 14px;
            font-weight: 600;
            color: #0033A0;
            outline: none;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .real-input:hover {
            transform: translateX(3px);
            background: #f6f9fc;
        }

        .real-input:focus {
            background: #ffffff;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(0, 51, 160, 0.14);
        }

        .real-input::placeholder {
            color: #0033A0;
            opacity: 0.85;
            font-weight: 600;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: #0033A0;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.8;
            transition: 0.2s;
            user-select: none;
        }

        .toggle-password:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .submit-real-btn {
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            height: 48px;
            background: #0033A0;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 12px rgba(0, 51, 160, 0.25);
        }

        .submit-real-btn:hover {
            background: #002169;
            transform: translateY(-2px) scale(1.015);
            box-shadow: 0 8px 20px rgba(0, 51, 160, 0.4);
        }

        .submit-real-btn:active {
            transform: scale(0.98);
        }

        /* ================= KHÔNG KHÍ TẾT: HOA MAI RƠI, BÒ ĐI DẠO & PHÁO HOA ================= */
        #tet-petals-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 900;
            overflow: hidden;
        }

        .mai-petal {
            position: absolute;
            top: -40px;
            user-select: none;
            pointer-events: none;
            animation: fallAndSway linear forwards;
            filter: drop-shadow(0 2px 4px rgba(217, 119, 6, 0.25));
        }

        @keyframes fallAndSway {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.95;
            }
            50% {
                transform: translateY(50vh) translateX(35px) rotate(180deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(108vh) translateX(-25px) rotate(360deg);
                opacity: 0.2;
            }
        }

        .cow-parade-track {
            position: fixed;
            bottom: 8px;
            left: 0;
            width: 100%;
            height: 46px;
            pointer-events: none;
            z-index: 850;
            overflow: hidden;
        }

        .walking-cow {
            position: absolute;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 32px;
            animation: cowWalkAcross 22s linear infinite, cowBounce 0.6s ease-in-out infinite alternate;
        }

        .walking-cow.cow-2 {
            animation-delay: -11s;
            font-size: 28px;
        }

        .cow-speech {
            background: #fff;
            color: #0033A0;
            border: 1.5px solid #0033A0;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 14px;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(0, 51, 160, 0.15);
            animation: speechUnflip 22s linear infinite;
        }

        .walking-cow.cow-2 .cow-speech {
            animation-delay: -11s;
        }

        @keyframes cowWalkAcross {
            0% {
                left: -180px;
                transform: scaleX(-1);
            }
            49% {
                left: calc(100vw + 40px);
                transform: scaleX(-1);
            }
            50% {
                left: calc(100vw + 40px);
                transform: scaleX(1);
            }
            99% {
                left: -180px;
                transform: scaleX(1);
            }
            100% {
                left: -180px;
                transform: scaleX(-1);
            }
        }

        @keyframes speechUnflip {
            0%, 49% {
                transform: scaleX(-1);
            }
            50%, 99% {
                transform: scaleX(1);
            }
            100% {
                transform: scaleX(-1);
            }
        }

        @keyframes cowBounce {
            0% { margin-bottom: 0px; }
            100% { margin-bottom: 6px; }
        }

        #fireworks-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        /* ================= MODAL THÔNG BÁO ĐĂNG KÝ THÀNH CÔNG ================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.3);
            border-top: 6px solid #0033A0;
        }

        .modal-card h3 {
            color: #0033A0;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal-close {
            background: #D91E2A;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .overlay-form-container {
                padding: 8px 10px 75px;
                gap: 8px;
            }
            .real-input {
                height: 32px;
                font-size: 11px;
            }
            .submit-real-btn {
                height: 36px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="landing-wrapper">
        <!-- Ảnh thiết kế nền -->
        <img src="images/design-bg.png" alt="Vinamilk Tết Khoẻ Re" class="design-canvas">

        <!-- Các vùng kích hoạt hiệu ứng động khi cuộn trang tới -->
        <div class="scroll-zone" style="top: 12%; height: 15%;"></div>
        <div class="scroll-zone" style="top: 28%; height: 12%;"></div>
        <div class="scroll-zone" style="top: 41%; height: 17%;"></div>
        <div class="scroll-zone" style="top: 59%; height: 12%;"></div>

        <!-- 3 vùng thẻ Voucher tương tác nổi lên khi rê chuột -->
        <div class="voucher-card-zone" style="left: 5.1%;" onclick="scrollToRegister()"></div>
        <div class="voucher-card-zone" style="left: 35.75%;" onclick="scrollToRegister()"></div>
        <div class="voucher-card-zone" style="left: 66.4%;" onclick="scrollToRegister()"></div>

        <!-- 3 nút Đăng nhập tương tác tại khu vực Voucher -->
        <button type="button" class="btn-voucher-login" style="top: 76.75%; left: 25.1%; width: 6.8%; height: 0.65%;" onclick="scrollToRegister()" title="Đăng nhập nhận Voucher Trà Atisô"></button>
        <button type="button" class="btn-voucher-login" style="top: 76.75%; left: 55.6%; width: 6.8%; height: 0.65%;" onclick="scrollToRegister()" title="Đăng nhập nhận Voucher Nước Ép"></button>
        <button type="button" class="btn-voucher-login" style="top: 76.75%; left: 86.1%; width: 6.8%; height: 0.65%;" onclick="scrollToRegister()" title="Đăng nhập nhận Voucher Cửa Hàng Vinamilk"></button>

        <!-- Nút Hero CTA dẫn thẳng tới ứng dụng Render -->
        <a href="https://vinamilk-1.onrender.com" target="_blank" rel="noopener noreferrer" class="hotspot-btn btn-hero" title="Đăng kí ưu đãi"></a>

        <!-- Các nút CTA phụ trượt xuống Form đăng ký -->
        <a href="#form-dang-ky" class="hotspot-btn btn-products" title="Đăng kí ngay"></a>
        <a href="#form-dang-ky" class="hotspot-btn btn-loyalty" title="Đăng kí ngay"></a>
        <a href="#form-dang-ky" class="hotspot-btn btn-steps" title="Đăng kí ngay"></a>

        <!-- Lớp vá chuẩn khít thẻ Voucher Trà Atisô đầu tiên -->
        <div class="voucher-fix-overlay" onclick="scrollToRegister()">
            <div class="v-sub">VOUCHER<br>TRÀ ATISÔ</div>
            <div class="v-store">CỬA HÀNG VINAMILK</div>
            <div class="v-amount">50.000đ</div>
        </div>

        <!-- Form đăng ký thật đồng bộ Zoho CRM -->
        <form id="form-dang-ky" class="overlay-form-container">
            <input type="text" class="real-input" id="tenDangNhap" placeholder="Tên đăng nhập *" required>
            <input type="tel" class="real-input" id="sdt" placeholder="Số điện thoại *" required>
            <input type="email" class="real-input" id="email" placeholder="Email nhận thông báo & ưu đãi *" required>
            
            <div class="form-row-2">
                <input type="text" class="real-input" id="hoDem" placeholder="Họ và tên đệm *" required>
                <input type="text" class="real-input" id="ten" placeholder="Tên *" required>
            </div>

            <!-- Ô nhập mật khẩu có nút con mắt -->
            <div class="password-wrapper">
                <input type="password" class="real-input" id="matKhau" placeholder="Nhập mật khẩu *" required>
                <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePass('matKhau', this)" title="Hiện/Ẩn mật khẩu"></i>
            </div>

            <!-- Ô xác nhận mật khẩu có nút con mắt -->
            <div class="password-wrapper">
                <input type="password" class="real-input" id="xacNhanMatKhau" placeholder="Xác nhận mật khẩu *" required>
                <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePass('xacNhanMatKhau', this)" title="Hiện/Ẩn mật khẩu"></i>
            </div>

            <button type="submit" class="submit-real-btn">Đăng ký nhận ưu đãi ngay</button>
        </form>
    </div>

    <!-- Hiệu ứng hoa mai rơi & đàn bò đi dạo -->
    <div id="tet-petals-container"></div>
    <div class="cow-parade-track">
        <div class="walking-cow">🐄<span class="cow-speech">Tết Khoẻ Re! 🥛</span></div>
        <div class="walking-cow cow-2">🐄<span class="cow-speech">100% Sữa Tươi! ✨</span></div>
    </div>

    <!-- Canvas bắn pháo hoa chúc mừng -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Popup thông báo thành công -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <h3>🎉 Đăng ký thành công! 🎉</h3>
            <p id="modalText"></p>
            <button class="modal-close" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <!-- Iframe ẩn giúp gửi form sang Zoho CRM chuẩn UTF-8 mà không làm tải lại trang -->
    <iframe name="zoho_hidden_iframe" id="zoho_hidden_iframe" style="display:none;"></iframe>

    <script>
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function scrollToRegister() {
            const registerForm = document.getElementById('form-dang-ky');
            if (registerForm) {
                registerForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    document.getElementById('tenDangNhap').focus();
                }, 400);
            }
        }

        // Kích hoạt chuyển động khi cuộn trang tới từng khu vực
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.scroll-zone, .overlay-form-container').forEach(el => {
            revealObserver.observe(el);
        });

        const form = document.getElementById('form-dang-ky');
        const modal = document.getElementById('successModal');
        const modalText = document.getElementById('modalText');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const tenDangNhap = document.getElementById('tenDangNhap').value.trim();
            const hoDem = document.getElementById('hoDem').value.trim();
            const ten = document.getElementById('ten').value.trim();
            const phone = document.getElementById('sdt').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass1 = document.getElementById('matKhau').value;
            const pass2 = document.getElementById('xacNhanMatKhau').value;

            if (pass1 !== pass2) {
                alert('Mật khẩu xác nhận chưa khớp, bạn kiểm tra lại nhé!');
                return;
            }

            // Tạo form chuẩn UTF-8 đẩy thẳng vào iframe ẩn tới Zoho CRM
            const zohoForm = document.createElement('form');
            zohoForm.method = 'POST';
            zohoForm.action = 'https://crm.zoho.com/crm/WebToContactForm';
            zohoForm.target = 'zoho_hidden_iframe';
            zohoForm.acceptCharset = 'UTF-8';
            zohoForm.style.display = 'none';

            const fields = {
                'xnQsjsdp': '273542a45a0e17eb5a8d7f62efbd45b8a1f2bf36a9217b8c5096c7226567d367',

        // 1. Hiệu ứng hoa mai vàng rơi liên tục
        function startMaiBlossomRain() {
            const container = document.getElementById('tet-petals-container');
            const icons = ['🌼', '🌸', '✨'];

            setInterval(() => {
                if (document.hidden) return;
                const petal = document.createElement('div');
                petal.className = 'mai-petal';
                petal.textContent = icons[Math.floor(Math.random() * icons.length)];
                
                const startLeft = Math.random() * 100;
                const duration = 6 + Math.random() * 5;
                const size = 14 + Math.random() * 12;

                petal.style.left = startLeft + 'vw';
                petal.style.fontSize = size + 'px';
                petal.style.animationDuration = duration + 's';

                container.appendChild(petal);
                setTimeout(() => petal.remove(), duration * 1000);
            }, 550);
        }
        startMaiBlossomRain();

        // 2. Hiệu ứng bắn pháo hoa rực rỡ khi ấn Đăng ký thành công
        function launchTetFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FFD700', '#FF2E63', '#00E5FF', '#FF9100', '#76FF03', '#FFFFFF'];

            function createBurst(x, y) {
                const count = 65;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const speed = 2 + Math.random() * 6;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 2.5 + Math.random() * 2.5
                    });
                }
            }

            const burstTimes = [0, 350, 700, 1100, 1500, 1900];
            burstTimes.forEach(delay => {
                setTimeout(() => {
                    const rx = canvas.width * (0.2 + Math.random() * 0.6);
                    const ry = canvas.height * (0.15 + Math.random() * 0.4);
                    createBurst(rx, ry);
                }, delay);
            });

            let animId;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.015;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (particles.length > 0) {
                    animId = requestAnimationFrame(render);
                } else {
                    canvas.style.display = 'none';
                    cancelAnimationFrame(animId);
                }
            }
            render();
        }
    </script>
